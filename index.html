<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>StageEye v1.0 AUTO Director · DUO/TRIO</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; background: #000; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  touch-action: manipulation;
}
#stage { position: fixed; inset: 0; overflow: hidden; background: #000; }
#videoA, #videoB {
  position: absolute; left: 50%; top: 50%;
  width: 100%; height: 100%; object-fit: cover;
  transform: translate(-50%, -50%) scale(1);
  transform-origin: center center;
  transition: transform 7s ease-out, opacity 1.4s ease-in-out;
  background: #000;
}
#videoA { z-index: 1; opacity: 1; }
#videoB { z-index: 2; opacity: 0; }
/* Crossfade two differently framed copies of the same live camera feed. */
/* アングル名・ステータス表示を画面上部に出さない */
#status { display: none !important; }
#controls {
  position: absolute; left: 0; right: 0;
  bottom: max(12px, env(safe-area-inset-bottom));
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 8px; padding: 10px; z-index: 30;
  transition: opacity .35s ease;
}
#controls.hidden { opacity: 0; pointer-events: none; }
button {
  border: 1px solid rgba(255,255,255,.22); border-radius: 12px;
  min-width: 86px; padding: 14px 20px; font-size: 17px;
  font-weight: 700; letter-spacing: .04em;
  background: rgba(35,35,35,.92); color: #fff;
  -webkit-appearance: none; appearance: none;
}
button:active { transform: scale(.97); }
button:disabled { opacity: .45; }
#autoBtn { min-width: 124px; background: #145b43; border-color: #3a9c78; }
#autoBtn.running { background: #8a302b; border-color: #d16b63; }
#cam1Btn, #cam2Btn { min-width: 68px; padding-inline: 12px; }
.modeBtn { min-width: 66px; padding-inline: 12px; }
.modeBtn.selected { background: #174e67; border-color: #63b9df; box-shadow: inset 0 0 0 1px #63b9df; }
@media (max-width: 380px) {
  #controls { gap: 6px; padding: 7px; }
  button { min-width: 60px; padding: 12px 9px; font-size: 14px; }
  #autoBtn { min-width: 104px; }
  #cam1Btn, #cam2Btn { min-width: 56px; padding-inline: 8px; }
  .modeBtn { min-width: 56px; padding-inline: 8px; }
}
@media (orientation: portrait) {
  #status { top: max(10px, env(safe-area-inset-top)); }
}
</style>
<script type="text/javascript" nonce="9fbb8002d6cb41a3b18e3dd4e8e" src="//local.adguard.org?ts=1791999129388&amp;type=content-script&amp;dmn=chatgpt.com&amp;url=https%3A%2F%2Fchatgpt.com%2Fbackend-api%2Festuary%2Fcontent%3Fid%3Dfile_00000000c8f0820cabadc961d673581d%26fn%3DStageEye_v1.0_AUTO_Director_DUO_TRIO_LeftRightWide.html%26cd%3Dattachment%26ts%3D497778%26p%3Dfs%26cid%3D1%26sig%3Dc4e6236367fed39a7d18589ced8c026f29649314755d0142a03132a37e3b9c6e%26v%3D0&amp;app=chrome.exe&amp;css=2&amp;js=1&amp;rel=1&amp;rji=1&amp;sbe=1"></script><script type="text/javascript" nonce="9fbb8002d6cb41a3b18e3dd4e8e" src="//local.adguard.org?ts=1791999129388&amp;name=AdGuard%20Extra&amp;name=AdGuard%20Popup%20Blocker&amp;type=user-script"></script></head>
<body>
<div id="stage">
  <video id="videoA" autoplay playsinline muted></video>
  <video id="videoB" autoplay playsinline muted></video>
  <div id="status" role="status" aria-live="polite">CAMERA READY · CAM1 / CAM2</div>
  <div id="controls">
    <button id="cam1Btn" type="button">CAM1</button>
    <button id="duoModeBtn" class="modeBtn" type="button" aria-pressed="false">DUO</button>
    <button id="trioModeBtn" class="modeBtn selected" type="button" aria-pressed="true">TRIO</button>
<button id="autoBtn" type="button" aria-pressed="false">AUTO START</button>
    <button id="cam2Btn" type="button">CAM2</button>
  </div>
</div>
<script>
(() => {
  "use strict";

  const videoA = document.getElementById("videoA");
  const videoB = document.getElementById("videoB");
  let activeVideo = videoA;
  let standbyVideo = videoB;
  const controls = document.getElementById("controls");
  const statusEl = document.getElementById("status");
  const autoBtn = document.getElementById("autoBtn");
  const cam1Btn = document.getElementById("cam1Btn");
  const cam2Btn = document.getElementById("cam2Btn");
  const duoModeBtn = document.getElementById("duoModeBtn");
  const trioModeBtn = document.getElementById("trioModeBtn");

  let currentStream = null;
  let activeFacing = null;
  let autoMode = false;
  let autoTimer = null;
  let transitionTimers = [];
  let hideTimer = null;
  let seqIndex = 0;
  let cameraBusy = false;
  let lastShot = "wide";
  let performanceMode = "trio";

  // AUTO sequence timings (milliseconds).
  // DUO: left position, full stage, right position — no performer-pair selection.
  // TRIO: retain the three-performer sequence.
  const trioSequence = [
    { shot: "wide",  time: 5000 },
    { shot: "vocal", time: 11000 },
    { shot: "wide",  time: 3500 },
    { shot: "piano", time: 10000 },
    { shot: "wide",  time: 3500 },
    { shot: "bass",  time: 10000 },
    { shot: "wide",  time: 3500 }
  ];

  const duoSequence = [
    { shot: "wide",  time: 5000 },
    { shot: "right", time: 11000 },
    { shot: "wide",  time: 3500 },
    { shot: "left",  time: 11000 },
    { shot: "wide",  time: 3500 }
  ];

  function getSequence() {
    return performanceMode === "duo" ? duoSequence : trioSequence;
  }

  function setPerformanceMode(mode) {
    performanceMode = mode;
    const isDuo = mode === "duo";
    duoModeBtn.classList.toggle("selected", isDuo);
    trioModeBtn.classList.toggle("selected", !isDuo);
    duoModeBtn.setAttribute("aria-pressed", String(isDuo));
    trioModeBtn.setAttribute("aria-pressed", String(!isDuo));
    // If AUTO is running, restart from the beginning of the newly selected sequence.
    if (autoMode) {
      seqIndex = 0;
      clearTimeout(autoTimer);
      runAuto();
    }
    showUI();
  }

  // Ken Burns-style framing: begin with a tighter hero crop, then drift/zoom
  // gently over 7 seconds. Horizontal positions are proportional to viewport width.
  const shots = {
    wide:  { zoom: 1.05, heroZoom: 1.12, x: 0,      drift: 0,      label: "WIDE" },
    // DUO positions: framing is based on screen side, not instrument/performer.
    right: { zoom: 1.58, heroZoom: 2.12, x: 0.19,   drift: -0.045, label: "RIGHT" },
    left:  { zoom: 1.58, heroZoom: 2.12, x: -0.19,  drift: 0.045,  label: "LEFT" },
    bass:  { zoom: 1.55, heroZoom: 2.30, x: 0.20,   drift: -0.067, label: "BASS" },
    vocal: { zoom: 1.65, heroZoom: 2.00, x: 0,      drift: 0.033,  label: "VOCAL" },
    piano: { zoom: 1.55, heroZoom: 2.20, x: -0.20,  drift: 0.067,  label: "PIANO" }
  };

  // Status text is intentionally never shown on screen.
  function setStatus(message) {
    statusEl.textContent = message;
  }

  function clearTransitionTimers() {
    transitionTimers.forEach(clearTimeout);
    transitionTimers = [];
  }

  function showUI() {
    controls.classList.remove("hidden");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      // Keep controls visible until a camera is active or AUTO is running.
      if (currentStream || autoMode) controls.classList.add("hidden");
    }, 5000);
  }

  function scheduleTransition(fn, delay) {
    const id = setTimeout(fn, delay);
    transitionTimers.push(id);
  }

  function applyShot(name) {
    const shot = shots[name];
    if (!shot) return;
    lastShot = name;
    clearTransitionTimers();

    const startX = Math.round(window.innerWidth * shot.x);
    const endX = Math.round(window.innerWidth * (shot.x + shot.drift));
    const incoming = standbyVideo;
    const outgoing = activeVideo;

    // Prepare the next crop invisibly, then softly crossfade between the two
    // copies of the same camera stream. This blends framing changes without blackouts.
    incoming.style.transition = "none";
    incoming.style.opacity = "0";
    incoming.style.transform =
      `translate(-50%, -50%) translateX(${startX}px) scale(${shot.heroZoom})`;

    // Force the initial framing to be applied before starting the animation.
    void incoming.offsetWidth;

    scheduleTransition(() => {
      incoming.style.transition = "opacity 1.4s ease-in-out, transform 7s ease-out";
      outgoing.style.transition = "opacity 1.4s ease-in-out, transform 7s ease-out";
      incoming.style.opacity = "1";
      outgoing.style.opacity = "0";
      // Slow zoom-out plus horizontal drift creates the Ken Burns Effect.
      incoming.style.transform =
        `translate(-50%, -50%) translateX(${endX}px) scale(${shot.zoom})`;
      activeVideo = incoming;
      standbyVideo = outgoing;
      // Deliberately do not display the current angle name/status.
    }, 40);
  }

  function stopAuto() {
    autoMode = false;
    clearTimeout(autoTimer);
    autoTimer = null;
    autoBtn.textContent = "AUTO START";
    autoBtn.classList.remove("running");
    autoBtn.setAttribute("aria-pressed", "false");
    setStatus(currentStream ? "CAMERA READY" : "CAMERA OFF");
  }

  function runAuto() {
    if (!autoMode) return;
    const activeSequence = getSequence();
    const step = activeSequence[seqIndex % activeSequence.length];
    applyShot(step.shot);
    clearTimeout(autoTimer);
    autoTimer = setTimeout(() => {
      if (!autoMode) return;
      seqIndex = (seqIndex + 1) % activeSequence.length;
      runAuto();
    }, step.time);
  }

  function startAuto() {
    if (!currentStream) {
      setStatus("先に CAM1 または CAM2 を起動してください");
      showUI();
      return;
    }
    autoMode = true;
    seqIndex = 0;
    autoBtn.textContent = "AUTO STOP";
    autoBtn.classList.add("running");
    autoBtn.setAttribute("aria-pressed", "true");
    runAuto();
    showUI();
  }

  async function startCamera(facing) {
    if (cameraBusy) return;
    cameraBusy = true;
    cam1Btn.disabled = true;
    cam2Btn.disabled = true;
    setStatus("CAMERA STARTING…");
    showUI();

    // Stop AUTO while switching camera so the sequence does not race the transition.
    stopAuto();

    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("この環境ではカメラを利用できません。HTTPSで開いてください。");
      }

      const oldStream = currentStream;
      currentStream = null;
      if (oldStream) oldStream.getTracks().forEach(track => track.stop());

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: facing },
          width: { ideal: 1280 },
          height: { ideal: 720 },
          frameRate: { ideal: 24, max: 30 }
        }
      });

      currentStream = stream;
      activeFacing = facing;
      videoA.srcObject = stream;
      videoB.srcObject = stream;
      await Promise.all([videoA.play(), videoB.play()]);

      // A camera change starts from the safe wide framing.
      applyShot("wide");
      setStatus(facing === "environment" ? "CAM1 · REAR CAMERA" : "CAM2 · FRONT CAMERA");
    } catch (err) {
      const name = err && err.name ? err.name : "CameraError";
      const message = err && err.message ? err.message : "カメラを起動できませんでした。";
      setStatus("CAMERA ERROR · " + name);
      alert("カメラを起動できませんでした。\n\n" + name + "\n" + message +
        "\n\nSafariでHTTPSのページを開き、カメラの使用を許可してください。");
    } finally {
      cameraBusy = false;
      cam1Btn.disabled = false;
      cam2Btn.disabled = false;
      showUI();
    }
  }

  cam1Btn.addEventListener("click", () => startCamera("environment"));
  cam2Btn.addEventListener("click", () => startCamera("user"));
  duoModeBtn.addEventListener("click", () => setPerformanceMode("duo"));
  trioModeBtn.addEventListener("click", () => setPerformanceMode("trio"));
autoBtn.addEventListener("click", () => {
    if (autoMode) {
      stopAuto();
      showUI();
    } else {
      startAuto();
    }
  });

  // Tapping the picture reveals the controls; the control buttons still work normally.
  document.getElementById("stage").addEventListener("pointerdown", (event) => {
    if (!event.target.closest("button")) showUI();
  });

  document.addEventListener("visibilitychange", () => {
    // Avoid timers racing in the background. Resume the sequence when Safari returns.
    if (document.hidden) {
      clearTimeout(autoTimer);
    } else if (autoMode) {
      runAuto();
      showUI();
    }
  });

  window.addEventListener("resize", () => {
    // Recalculate horizontal framing for the current viewport.
    if (currentStream && lastShot) applyShot(lastShot);
  });

  window.addEventListener("beforeunload", () => {
    clearTimeout(autoTimer);
    clearTimeout(hideTimer);
    clearTransitionTimers();
    if (currentStream) currentStream.getTracks().forEach(track => track.stop());
  });

  showUI();
})();
</script>
</body>
</html>
